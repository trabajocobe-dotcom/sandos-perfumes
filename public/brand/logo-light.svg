<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 30 560 270" width="560" height="270">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4BA6A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A84C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A88A3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4BA6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#D4BA6A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Frasco de perfume minimalista -->
  <g transform="translate(100, 50)">
    <rect x="37" y="0" width="26" height="8" rx="2" fill="url(#goldGradient)"/>
    <rect x="43" y="8" width="14" height="12" rx="1" fill="url(#goldGradient)"/>
    <rect x="45" y="20" width="10" height="16" fill="url(#bottleGold)"/>
    <path d="M30 36 L25 180 Q25 195 40 195 L60 195 Q75 195 75 180 L70 36 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linejoin="round"/>
    <line x1="30" y1="55" x2="70" y2="55" stroke="#C9A84C" stroke-width="1.5" opacity="0.6"/>
    <rect x="35" y="80" width="30" height="45" rx="2" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
    <path d="M32 40 L32 170" stroke="url(#shine)" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- SANDÓS -->
  <text x="230" y="165" 
        font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
        font-size="72" font-weight="700" letter-spacing="8" fill="#1A1A1A">SANDÓS</text>

  <line x1="230" y1="182" x2="530" y2="182" stroke="url(#goldGradient)" stroke-width="2"/>

  <text x="230" y="218" 
        font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="20" font-weight="400" letter-spacing="14" fill="#C9A84C">PERFUMES</text>

  <text x="230" y="255" 
        font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="11" font-weight="300" letter-spacing="4" fill="#999999">FRAGANCIAS QUE DEJAN HUELLA</text>

  <g transform="translate(620, 130)">
    <path d="M0 -25 L20 0 L0 25 L-20 0 Z" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="3" fill="#C9A84C" opacity="0.5"/>
  </g>
</svg>
